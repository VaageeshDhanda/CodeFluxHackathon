<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostleHive - Signup</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
    <div class="container" style="padding-top: 40px;">
        <h1 style="text-align: center; margin-bottom: 8px;">Create Account</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">Join your campus network</p>
        
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Rahul Sharma">

        <label>University Email</label>
        <input type="email" id="signup-email" placeholder="student@lpu.in">

        <label>University Roll/ID Number</label>
        <input type="text" id="signup-roll" placeholder="12001122">
        
        <button onclick="handleSignup()">Register</button>
        <p style="text-align: center; margin-top: 20px; font-size: 14px;">
            Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Log in</a>
        </p>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
