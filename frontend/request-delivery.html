<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Request Delivery - HostleHive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Top Navigation -->
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">⬅ Back</a>
                <span class="navbar-text text-white fw-bold">Request Delivery</span>
            </div>
        </nav>

        <div class="container">
            <h4 class="mb-3">Parcel Details</h4>
            
            <form id="delivery-form">
                
                <!-- Description Field -->
                <div class="mb-3">
                    <label class="form-label text-muted">What needs to be delivered?</label>
                    <input type="text" id="description" class="form-control" placeholder="e.g., Laptop charger, Books" required>
                </div>

                <!-- Pickup Field -->
                <div class="mb-3">
                    <label class="form-label text-muted">Where is it? (Pickup)</label>
                    <select id="pickup_location_id" class="form-select" required>
                        <option value="" disabled selected>Select location...</option>
                        <option value="1">Hostel A</option>
                        <option value="2">Hostel B</option>
                        <option value="3">Main Gate</option>
                        <option value="4">Library</option>
                    </select>
                </div>

                <!-- Drop-off Field -->
                <div class="mb-3">
                    <label class="form-label text-muted">Where to? (Drop-off)</label>
                    <select id="drop_location_id" class="form-select" required>
                        <option value="" disabled selected>Select location...</option>
                        <option value="1">Hostel A</option>
                        <option value="2">Hostel B</option>
                        <option value="3">Main Gate</option>
                        <option value="4">Library</option>
                    </select>
                </div>

                <!-- Reward Field -->
                <div class="mb-4">
                    <label class="form-label text-muted">Base Reward (₹)</label>
                    <input type="number" id="reward" class="form-control" placeholder="e.g., 50" required min="0">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Request Delivery</button>
            </form>
        </div>
    </div>

    <!-- Core App JS -->
    <script src="js/app.js"></script>

    <!-- Submission Logic -->
    <script>
        document.getElementById('delivery-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Build the payload EXACTLY as the backend schema demands
            const payload = {
                requester_id: 1, 
                description: document.getElementById('description').value,
                pickup_location_id: parseInt(document.getElementById('pickup_location_id').value),
                dropoff_location_id: parseInt(document.getElementById('drop_location_id').value), // Fixing the spelling typo for the backend
                reward: parseFloat(document.getElementById('reward').value),
                source_type: "external_parcel",
                tip: 0
            };

            try {
                // API_URL comes from app.js
                const response = await fetch(API_URL + '/delivery/requests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('Delivery requested successfully!');
                    window.location.href = 'activity.html';
                } else {
                    const errData = await response.json();
                    console.error('Server error:', errData);
                    // This alert will explicitly tell you which field is still causing a 422 error
                    alert('Failed (422). The backend rejected: ' + JSON.stringify(errData.detail || errData));
                }
            } catch (error) {
                console.error('Network error:', error);
                alert('Network error. Check connection to Render backend.');
            }
        });
    </script>

    <!-- 1. Load the vConsole library -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>

    <!-- 2. Initialize it -->
    <script>
      if (typeof window.VConsole !== 'undefined') {
          var vConsole = new window.VConsole();
      }
    </script>
</body>
</html>
