<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HostleHive - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
    <div class="container" style="padding-top: 50px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h1 style="font-size: 26px; margin-bottom: 6px;">HostleHive</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Campus Delivery & Marketplace</p>
        </div>

        <div id="error-banner" class="hidden" style="background: #FEE2E2; color: #DC2626; padding: 12px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 16px; text-align: center;"></div>

        <div style="background: var(--surface); padding: 24px; border-radius: var(--radius-lg); box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <label>University Email</label>
            <input type="email" id="login-email" placeholder="rahul@lpu.in" required>

            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>

            <button onclick="handleSecureLogin()" style="margin-top: 8px;">Log In</button>
        </div>

        <p style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            New to campus? <a href="signup.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create an account</a>
        </p>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
